name: build-push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/xchewtoyx/hermes-docker

jobs:
  ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${{ env.GHCR_IMAGE }}:latest,${{ env.GHCR_IMAGE }}:${{ github.ref_name }}"
          else
            TAGS="${{ env.GHCR_IMAGE }}:latest,${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push to Docker Hub too — enable by adding repo secrets:
  #   DOCKERHUB_USERNAME  (your Docker Hub username)
  #   DOCKERHUB_TOKEN     (an access token with Read/Write, not your password)
  dockerhub:
    if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    needs: ghcr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            xchewtoyx/hermes-docker:latest
            ${{ github.ref_type == 'tag' && format('xchewtoyx/hermes-docker:{0}', github.ref_name) || '' }}
          cache-from: type=gha
