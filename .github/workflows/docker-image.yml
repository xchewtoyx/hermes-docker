name: build-push

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # A cold headless build populates the shared devtools cache before the
      # GUI target adds its desktop layer. Later cloud builds reuse both.
      max-parallel: 1
      matrix:
        include:
          - image: hermes-docker
            target: headless
          - image: hermes-docker-gui
            target: gui

    steps:
      - uses: actions/checkout@v7

      # Docker authentication is required to connect to Build Cloud. The same
      # credentials publish Docker Hub copies when DOCKERHUB_ENABLED=true.
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@v4
        with:
          driver: cloud
          endpoint: "${{ vars.DOCKERHUB_USERNAME }}/${{ vars.CLOUD_BUILDER_NAME || 'clustertool' }}"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/xchewtoyx/${{ matrix.image }}
            name=xchewtoyx/${{ matrix.image }},enable=${{ vars.DOCKERHUB_ENABLED == 'true' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      # Build Cloud has native workers and a managed persistent cache for both
      # target architectures, so no QEMU or GHA cache exporter is needed.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
